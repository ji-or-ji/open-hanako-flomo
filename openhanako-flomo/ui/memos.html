<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flomo</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text, #cfd8e3); font-size: 13px;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* structural 形态：宿主给标题区，自己不再画标题栏 */
  .bar { display: none; }
  .bar h1 { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; opacity: .7; margin: 0; }
  .count { font-size: 10.5px; opacity: .42; font-variant-numeric: tabular-nums; }
  .grow { flex: 1; }
  .icon {
    width: 22px; height: 22px; flex: none;
    display: grid; place-items: center;
    border: 1px solid rgba(255,255,255,.09); border-radius: 7px;
    background: rgba(255,255,255,.04); color: inherit;
    font: inherit; font-size: 11px; cursor: pointer;
    transition: background .16s ease, border-color .16s ease;
  }
  .icon:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
  .icon:disabled { opacity: .4; cursor: default; }

  /* ---- 搜索（左边三个小图标，右边搜索框） ---- */
  .tools { padding: 0 12px 6px; display: flex; align-items: center; gap: 5px; flex: none; }
  input[type="search"] {
    flex: 1; min-width: 0; height: 26px; padding: 0 9px;
    border: 1px solid rgba(255,255,255,.09); border-radius: 8px;
    background: rgba(255,255,255,.04); color: inherit; font: inherit; font-size: 12px;
    outline: none;
  }
  input[type="search"]:focus { border-color: rgba(127,214,192,.45); }
  input[type="search"]::placeholder { color: rgba(207,216,227,.35); }
  .chips { display: flex; gap: 5px; overflow-x: auto; padding: 0 12px 6px; scrollbar-width: none; flex: none; align-items: center; }
  .chips .count { margin-left: auto; padding-left: 6px; flex: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 22px; padding: 0 9px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03);
    color: inherit; font: inherit; font-size: 11px; opacity: .75; cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { background: rgba(127,214,192,.14); border-color: rgba(127,214,192,.4); opacity: 1; }

  /* ---- 列表 ---- */
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 8px; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
  .group { font-size: 10.5px; letter-spacing: .06em; opacity: .38; padding: 10px 2px 5px; position: sticky; top: 0; background: linear-gradient(rgba(15,20,25,.92), rgba(15,20,25,.72)); backdrop-filter: blur(4px); }
  .memo {
    position: relative; padding: 9px 10px; margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,.06); border-radius: 10px;
    background: rgba(255,255,255,.028);
    transition: border-color .16s ease, background .16s ease;
  }
  .memo:hover { background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.12); }
  .memo .time { font-size: 10.5px; opacity: .4; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .memo .text { line-height: 1.6; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .memo.open .text { -webkit-line-clamp: unset; }
  .memo .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .memo .tag { font-size: 10.5px; color: #7FD6C0; opacity: .85; }
  .acts { position: absolute; right: 6px; top: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .14s ease; }
  .memo:hover .acts, .memo:focus-within .acts { opacity: 1; }
  .acts button {
    height: 21px; padding: 0 7px; border-radius: 7px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(20,26,33,.9); color: inherit; font: inherit; font-size: 10.5px; cursor: pointer;
  }
  .acts button:hover { background: rgba(127,214,192,.18); border-color: rgba(127,214,192,.45); }

  .empty { padding: 28px 18px; text-align: center; opacity: .5; line-height: 1.9; font-size: 12px; }

  /* ---- 底部写一条 ---- */
  .composer { flex: none; border-top: 1px solid rgba(255,255,255,.07); padding: 8px 10px 9px; display: flex; gap: 7px; align-items: flex-end; }
  textarea {
    flex: 1; min-height: 32px; max-height: 108px; resize: none;
    padding: 7px 10px; border: 1px solid rgba(255,255,255,.09); border-radius: 9px;
    background: rgba(255,255,255,.04); color: inherit; font: inherit; font-size: 12px;
    line-height: 1.5; outline: none;
  }
  textarea:focus { border-color: rgba(127,214,192,.45); }
  .send {
    height: 32px; padding: 0 13px; border-radius: 9px; border: 0;
    background: rgba(127,214,192,.9); color: #0f1419; font: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .16s ease;
  }
  .send:disabled { opacity: .4; cursor: default; }

  /* ---- 提示条 ---- */
  #note {
    position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%);
    max-width: 92%; padding: 6px 12px; border-radius: 9px;
    background: rgba(20,26,33,.94); border: 1px solid rgba(255,255,255,.1);
    font-size: 11.5px; opacity: 0; pointer-events: none; transition: opacity .2s ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #note.show { opacity: 1; }
  #note.ok { color: #7FD6A8; }
  #note.bad { color: #E06C5A; }

  #drop {
    position: fixed; inset: 0; z-index: 20; display: none; place-content: center;
    background: rgba(15,20,25,.84); color: #cfd8e3; font-size: 14px;
    border: 2px dashed rgba(127,214,192,.5); border-radius: 14px;
  }
  #drop.show { display: grid; }
</style>
</head>
<body>
<div class="bar">
  <h1>FLOMO</h1>
</div>

<div class="tools">
  <button class="icon" id="pick" type="button" title="导入导出包（也可以直接把 zip 拖进来）">导</button>
  <button class="icon" id="web" type="button" title="在系统浏览器里打开网页版">网</button>
  <button class="icon" id="refresh" type="button" title="重新读一遍本地笔记">刷</button>
  <input id="q" type="search" placeholder="搜内容或标签…">
</div>

<div class="chips" id="chips"><span class="count" id="count"></span></div>

<div class="list" id="list"></div>

<div class="composer">
  <textarea id="draft" rows="1" placeholder="记一条…（走 Incoming Webhook）"></textarea>
  <button class="send" id="send" type="button">发送</button>
</div>

<div id="note"></div>
<div id="drop">松手就导入</div>
<input id="file" type="file" accept=".zip,.html,.htm" hidden>

<script type="module">
  import { hana } from "./assets/sdk.js";

  const BASE = "http://127.0.0.1:47811";
  const el = (id) => document.getElementById(id);
  const listEl = el("list");
  const chipsEl = el("chips");
  const countEl = el("count");
  const qEl = el("q");
  const draftEl = el("draft");
  const sendBtn = el("send");
  const noteEl = el("note");

  let memos = [];
  let tagFilter = "";
  let noteTimer = null;

  function say(text, kind = "") {
    noteEl.textContent = text;
    noteEl.className = "show " + kind;
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(() => (noteEl.className = ""), 4200);
  }

  async function api(path, init) {
    const res = await fetch(BASE + path, { cache: "no-store", ...init });
    return res.json();
  }

  const monthKey = (time) => String(time || "").slice(0, 7);
  function monthLabel(key) {
    if (!key) return "无日期";
    const [y, m] = key.split("-");
    return `${y} 年 ${Number(m)} 月`;
  }

  function matches(m) {
    if (tagFilter && !(m.tags || []).some((t) => t === tagFilter || t.startsWith(tagFilter + "/"))) return false;
    const q = qEl.value.trim().toLowerCase();
    if (!q) return true;
    return (m.content || "").toLowerCase().includes(q) || (m.tags || []).some((t) => t.toLowerCase().includes(q));
  }

  function renderChips() {
    const counts = new Map();
    for (const m of memos) for (const t of m.tags || []) counts.set(t, (counts.get(t) || 0) + 1);
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14);
    chipsEl.textContent = "";
    for (const [name, n] of top) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (tagFilter === name ? " on" : "");
      b.textContent = `${name} ${n}`;
      b.addEventListener("click", () => {
        tagFilter = tagFilter === name ? "" : name;
        renderChips();
        renderList();
      });
      chipsEl.append(b);
    }
    chipsEl.append(countEl);
  }

  function renderList() {
    const shown = memos.filter(matches);
    countEl.textContent = memos.length ? `${shown.length}/${memos.length}` : "";
    listEl.textContent = "";
    if (!memos.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "本地还没有笔记。点右上「导入」，选 flomo 导出的 zip；或者直接拖进来。";
      listEl.append(d);
      return;
    }
    if (!shown.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "没有匹配的笔记。";
      listEl.append(d);
      return;
    }
    let current = "";
    for (const m of shown) {
      const key = monthKey(m.time);
      if (key !== current) {
        current = key;
        const g = document.createElement("div");
        g.className = "group";
        g.textContent = monthLabel(key);
        listEl.append(g);
      }
      listEl.append(memoNode(m));
    }
  }

  function memoNode(m) {
    const box = document.createElement("div");
    box.className = "memo";

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = String(m.time || "").slice(5);

    const text = document.createElement("div");
    text.className = "text";
    text.textContent = m.content || "";
    text.addEventListener("click", () => box.classList.toggle("open"));

    box.append(time, text);

    if (m.tags && m.tags.length) {
      const tags = document.createElement("div");
      tags.className = "tags";
      for (const t of m.tags) {
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = "#" + t;
        tags.append(s);
      }
      box.append(tags);
    }

    const acts = document.createElement("div");
    acts.className = "acts";

    const quote = document.createElement("button");
    quote.type = "button";
    quote.textContent = "引用";
    quote.title = "把这条发进当前会话";
    quote.addEventListener("click", (e) => {
      e.stopPropagation();
      void quoteIntoSession(m, quote);
    });

    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "复制";
    copy.title = "只复制到剪贴板，不打扰会话";
    copy.addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(m.content || "");
        say("已复制", "ok");
      } catch {
        say("复制失败", "bad");
      }
    });

    acts.append(quote, copy);
    box.append(acts);
    return box;
  }

  async function activeSession() {
    try {
      const s = await hana.sessions.getActive();
      const sessionId = s?.sessionId || s?.id || "";
      const sessionPath = s?.sessionPath || s?.path || "";
      return { sessionId, sessionPath };
    } catch {
      return { sessionId: "", sessionPath: "" };
    }
  }

  async function quoteIntoSession(m, btn) {
    const target = await activeSession();
    if (!target.sessionId && !target.sessionPath) {
      say("没拿到当前会话，先在主窗口打开一个对话", "bad");
      return;
    }
    btn.disabled = true;
    try {
      const r = await api("/__quote", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          text: `引用 flomo 笔记（${m.time}）：\n${m.content}`,
          sessionId: target.sessionId,
          sessionPath: target.sessionPath,
        }),
      });
      if (r.ok) say("已投递到当前会话", "ok");
      else say(r.error || "投递失败", "bad");
    } catch (err) {
      say(`投递失败：${err?.message || err}`, "bad");
    } finally {
      btn.disabled = false;
    }
  }

  async function load() {
    try {
      const r = await api("/__memos");
      memos = Array.isArray(r.memos) ? r.memos : [];
      renderChips();
      renderList();
    } catch {
      memos = [];
      countEl.textContent = "";
      listEl.textContent = "";
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "连不上本地服务（127.0.0.1:47811）。重开一次这个卡片试试。";
      listEl.append(d);
    }
  }

  // ---- 写一条 ----
  async function send() {
    const text = draftEl.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    try {
      const r = await api("/__memo/new", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (r.ok) {
        draftEl.value = "";
        autosize();
        say("已发送到 flomo", "ok");
      } else say(r.error || "发送失败", "bad");
    } catch (err) {
      say(`发送失败：${err?.message || err}`, "bad");
    } finally {
      sendBtn.disabled = false;
    }
  }

  function autosize() {
    draftEl.style.height = "auto";
    draftEl.style.height = Math.min(108, draftEl.scrollHeight) + "px";
  }

  sendBtn.addEventListener("click", send);
  draftEl.addEventListener("input", autosize);
  draftEl.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") send();
  });

  // ---- 导入 ----
  async function upload(file) {
    if (!file) return;
    say(`正在导入 ${file.name}…`);
    try {
      const buf = await file.arrayBuffer();
      const res = await fetch(`${BASE}/__sync/upload?name=${encodeURIComponent(file.name)}`, {
        method: "POST",
        headers: { "content-type": "application/octet-stream" },
        body: buf,
      });
      const r = await res.json();
      if (r.ok) {
        say(`已导入 ${r.parsed} 条，新增 ${r.added} 条，共 ${r.total} 条`, "ok");
        await load();
      } else say(r.reason || r.error || "这个文件里没有 flomo 笔记", "bad");
    } catch (err) {
      say(`导入失败：${err?.message || err}`, "bad");
    }
  }

  el("pick").addEventListener("click", () => el("file").click());
  el("file").addEventListener("change", () => {
    const f = el("file").files && el("file").files[0];
    el("file").value = "";
    if (f) void upload(f);
  });
  el("refresh").addEventListener("click", () => load());
  el("web").addEventListener("click", async () => {
    try {
      await api("/__open", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ url: "https://v.flomoapp.com/mine" }),
      });
    } catch {
      say("打不开浏览器", "bad");
    }
  });

  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    e.preventDefault();
    dragDepth += 1;
    el("drop").classList.add("show");
  });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("dragleave", () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) el("drop").classList.remove("show");
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    dragDepth = 0;
    el("drop").classList.remove("show");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) void upload(f);
  });

  qEl.addEventListener("input", renderList);
  try {
    hana.chrome?.registerScrollSource?.(listEl);
  } catch {
    /* 旧宿主不认识就算了 */
  }
  await hana.ready?.();
  await load();
</script>
</body>
</html>
