<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flomo</title>
<style>
  /* 宿主主题 token 优先；取不到时用下面这套自带的深/浅兜底，两套都不会瞎。 */
  :root {
    --f-text: #cfd8e3;
    --f-surface: rgba(255, 255, 255, .04);
    --f-surface-hi: rgba(255, 255, 255, .075);
    --f-line: rgba(255, 255, 255, .12);
    --f-accent: #7FD6C0;
    --f-accent-ink: #0f1419;
    --f-bg: #161a1f;
    --f-overlay: rgba(15, 20, 25, .86);
    --f-shadow: rgba(0, 0, 0, .4);
  }
  html[data-theme="light"] {
    --f-text: #2c3540;
    --f-surface: rgba(16, 24, 32, .04);
    --f-surface-hi: rgba(16, 24, 32, .075);
    --f-line: rgba(16, 24, 32, .13);
    --f-accent: #1f8a74;
    --f-accent-ink: #ffffff;
    --f-bg: #faf8f5;
    --f-overlay: rgba(250, 250, 248, .92);
    --f-shadow: rgba(30, 40, 50, .18);
  }

  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-ui, system-ui, -apple-system, "Segoe UI", sans-serif);
    color: var(--text, var(--f-text));
    font-size: var(--fs-caption, 12.5px);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* structural 形态：宿主给标题区，自己不再画标题栏 */
  .bar { display: none; }
  .count { font-size: var(--fs-hint, 11px); opacity: .55; font-variant-numeric: tabular-nums; }
  .icon {
    width: 22px; height: 22px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--input-card-border-color, var(--f-line));
    border-radius: var(--radius-sm, 6px);
    background: var(--overlay-subtle, var(--f-surface));
    color: inherit; font: inherit; font-size: var(--fs-hint, 11px);
    cursor: pointer; transition: background var(--duration-fast, .15s) ease, border-color var(--duration-fast, .15s) ease;
  }
  .icon:hover {
    background: var(--overlay-light, var(--f-surface-hi));
    border-color: var(--overlay-strong, var(--f-line));
  }
  .icon:disabled { opacity: .4; cursor: default; }

  /* ---- 搜索（左边三个小图标，右边搜索框） ---- */
  .tools { padding: 0 12px 6px; display: flex; align-items: center; gap: 5px; flex: none; }
  input[type="search"] {
    flex: 1; min-width: 0; height: 26px; padding: 0 9px;
    border: 1px solid var(--input-card-border-color, var(--f-line));
    border-radius: var(--radius-input, 8px);
    background: var(--overlay-subtle, var(--f-surface));
    color: inherit; font: inherit; font-size: var(--fs-caption, 12px);
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent, var(--f-accent)); }
  input[type="search"]::placeholder { color: var(--text-muted, inherit); opacity: .6; }

  .chips { display: flex; gap: 5px; overflow-x: auto; padding: 0 12px 6px; scrollbar-width: none; flex: none; align-items: center; }
  .chips .count { margin-left: auto; padding-left: 6px; flex: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 22px; padding: 0 9px; border-radius: var(--radius-sm, 6px);
    border: 1px solid var(--input-card-border-color, var(--f-line));
    background: var(--overlay-subtle, var(--f-surface));
    color: inherit; font: inherit; font-size: var(--fs-hint, 11px); opacity: .8;
    cursor: pointer; white-space: nowrap;
  }
  .chip.on {
    background: var(--accent-light, color-mix(in srgb, var(--f-accent) 16%, transparent));
    border-color: color-mix(in srgb, var(--accent, var(--f-accent)) 45%, transparent);
    opacity: 1;
  }

  /* ---- 列表 ---- */
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 8px; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb {
    background: var(--overlay-medium, var(--f-line));
    border-radius: 4px; border: 2px solid transparent; background-clip: content-box;
  }
  .group {
    font-size: var(--fs-hint, 10.5px); letter-spacing: .06em; opacity: .62;
    padding: 10px 2px 5px; position: sticky; top: 0;
    background: color-mix(in srgb, var(--bg, var(--f-bg)) 90%, transparent);
    backdrop-filter: blur(6px);
  }
  .memo {
    position: relative; padding: 9px 10px; margin-bottom: 6px;
    border: 1px solid var(--input-card-border-color, var(--f-line));
    border-radius: var(--radius-md, 8px);
    background: var(--overlay-subtle, var(--f-surface));
    transition: border-color var(--duration-fast, .15s) ease, background var(--duration-fast, .15s) ease;
  }
  .memo:hover {
    background: var(--overlay-light, var(--f-surface-hi));
    border-color: var(--overlay-strong, var(--f-line));
  }
  .memo .time { font-size: var(--fs-hint, 10.5px); opacity: .6; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .memo .time .no { color: var(--accent, var(--f-accent)); opacity: .95; margin-right: 5px; font-variant-numeric: tabular-nums; }
  .memo .text {
    line-height: 1.62; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    font-size: var(--fs-body, 13px);
  }
  .memo.open .text { -webkit-line-clamp: unset; }
  .memo .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .memo .tag { font-size: var(--fs-hint, 10.5px); color: var(--accent, var(--f-accent)); opacity: .9; }
  .acts { position: absolute; right: 6px; top: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity var(--duration-fast, .15s) ease; }
  .memo:hover .acts, .memo:focus-within .acts { opacity: 1; }
  .acts button {
    height: 21px; padding: 0 7px; border-radius: var(--radius-sm, 6px);
    border: 1px solid var(--input-card-border-color, var(--f-line));
    background: var(--bg-card, var(--f-surface));
    color: inherit; font: inherit; font-size: var(--fs-hint, 10.5px); cursor: pointer;
  }
  .acts button:hover { background: var(--accent-light, var(--f-surface-hi)); }

  .empty { padding: 28px 18px; text-align: center; opacity: .6; line-height: 1.9; font-size: var(--fs-caption, 12px); }

  /* ---- 底部写一条 ---- */
  .composer {
    flex: none; border-top: 1px solid var(--input-card-border-color, var(--f-line));
    padding: 8px 10px 9px; display: flex; gap: 7px; align-items: flex-end;
  }
  textarea {
    flex: 1; min-height: 32px; max-height: 108px; resize: none;
    padding: 7px 10px;
    border: 1px solid var(--input-card-border-color, var(--f-line));
    border-radius: var(--radius-input, 8px);
    background: var(--overlay-subtle, var(--f-surface));
    color: inherit; font: inherit; font-size: var(--fs-caption, 12px);
    line-height: 1.5; outline: none;
  }
  textarea:focus { border-color: var(--accent, var(--f-accent)); }
  textarea::placeholder { color: var(--text-muted, inherit); opacity: .6; }
  .send {
    height: 32px; padding: 0 13px; border-radius: var(--radius-md, 8px); border: 0;
    background: var(--accent, var(--f-accent));
    color: var(--on-accent, var(--f-accent-ink));
    font: inherit; font-size: var(--fs-caption, 12px); font-weight: 600;
    cursor: pointer; transition: opacity var(--duration-fast, .15s) ease;
  }
  .send:hover { opacity: .88; }
  .send:disabled { opacity: .45; cursor: default; }

  /* ---- 提示条 ---- */
  #note {
    position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%);
    max-width: 92%; padding: 6px 12px; border-radius: var(--radius-md, 8px);
    background: var(--bg-card, var(--f-surface));
    border: 1px solid var(--border, var(--f-line));
    box-shadow: var(--shadow-md, 0 4px 12px var(--f-shadow));
    font-size: var(--fs-hint, 11.5px);
    opacity: 0; pointer-events: none; transition: opacity var(--duration-fast, .15s) ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #note.show { opacity: 1; }
  #note.ok { color: var(--green, #4e9e73); }
  #note.bad { color: var(--danger, #c9523f); }

  #drop {
    position: fixed; inset: 0; z-index: 20; display: none; place-content: center;
    background: var(--drop-overlay-bg, var(--f-overlay));
    color: var(--text, var(--f-text)); font-size: var(--fs-body, 14px);
    border: 2px dashed color-mix(in srgb, var(--accent, var(--f-accent)) 55%, transparent);
    border-radius: var(--radius-lg, 14px);
  }
  #drop.show { display: grid; }

  /* 划词工具条：跟宿主同一套底色与阴影，深色深、浅色白 */
  #selBar {
    position: fixed; z-index: 30; display: none; align-items: center; gap: 2px;
    padding: 4px;
    border-radius: var(--radius-md, 10px);
    background: var(--bg-glass, var(--bg-card, var(--f-surface)));
    color: var(--text, var(--f-text));
    box-shadow: var(--shadow-lg, 0 4px 12px var(--f-shadow));
    backdrop-filter: blur(10px);
  }
  #selBar.show { display: flex; }
  #selBar button {
    display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 10px; border: 0;
    border-radius: var(--radius-sm, 6px);
    background: transparent; color: inherit;
    font: inherit; font-size: var(--fs-caption, 12px); cursor: pointer;
    transition: background var(--duration-instant, .1s) ease;
    white-space: nowrap;
  }
  #selBar button:hover { background: var(--overlay-medium, var(--f-surface-hi)); }
  #selBar svg { width: 13px; height: 13px; opacity: .8; flex: none; }
</style>
</head>
<body>
<div class="bar">
  <h1>FLOMO</h1>
</div>

<div class="tools">
  <button class="icon" id="pick" type="button" title="导入导出包（也可以直接把 zip 拖进来）">导</button>
  <button class="icon" id="web" type="button" title="在系统浏览器里打开网页版">网</button>
  <button class="icon" id="refresh" type="button" title="重新读一遍本地笔记">刷</button>
  <input id="q" type="search" placeholder="搜内容或标签…">
</div>

<div class="chips" id="chips"><span class="count" id="count"></span></div>

<div class="list" id="list"></div>

<div class="composer">
  <textarea id="draft" rows="1" placeholder="记一条…（走 Incoming Webhook）"></textarea>
  <button class="send" id="send" type="button">发送</button>
</div>

<div id="note"></div>
<div id="drop">松手就导入</div>
<div id="selBar">
  <button id="selQuote" type="button">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M6 4.5c-1.6.6-2.6 1.9-2.6 3.6M6 4.5v3.2H3.2c0 2 .9 3.1 2.8 3.6" />
      <path d="M12.4 4.5c-1.6.6-2.6 1.9-2.6 3.6M12.4 4.5v3.2H9.6c0 2 .9 3.1 2.8 3.6" />
    </svg>
    引用到对话
  </button>
  <button id="selCopy" type="button">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.6" />
      <path d="M10.5 3.5H4.2A1.2 1.2 0 0 0 3 4.7v6.3" />
    </svg>
    复制
  </button>
</div>
<input id="file" type="file" accept=".zip,.html,.htm" hidden>

<script type="module">
  import { hana } from "./assets/sdk.js";

  // 宿主给的是深色还是浅色？--text 是宿主注入的正文色，拿它的亮度判断。
  function applyTheme() {
    // 先问宿主（hana.theme 的 appearance 最准），再拿 --text 亮度推，最后看系统偏好。
    let light = null;
    try {
      const snap = hana.theme?.getSnapshot?.();
      if (snap?.appearance === "light") light = true;
      else if (snap?.appearance === "dark") light = false;
    } catch {
      /* 旧宿主没有 theme */
    }
    if (light === null) {
      const hostText = getComputedStyle(document.documentElement).getPropertyValue("--text").trim();
      if (hostText) {
        const probe = document.createElement("span");
        probe.style.color = hostText;
        document.body.append(probe);
        const rgb = getComputedStyle(probe).color;
        probe.remove();
        const parts = rgb.match(/\d+/g);
        if (parts) {
          const [r, g, b] = parts.map(Number);
          light = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.5;
        }
      }
    }
    if (light === null) light = window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme = light ? "light" : "dark";
  }
  applyTheme();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") applyTheme();
  });
  try {
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);
  } catch {
    /* 旧内核 */
  }

  const BASE = "http://127.0.0.1:47811";
  const el = (id) => document.getElementById(id);
  const listEl = el("list");
  const chipsEl = el("chips");
  const countEl = el("count");
  const qEl = el("q");
  const draftEl = el("draft");
  const sendBtn = el("send");
  const noteEl = el("note");
  const selBtn = el("selBar");

  let memos = [];
  let tagFilter = "";
  let noteTimer = null;

  function say(text, kind = "") {
    noteEl.textContent = text;
    noteEl.className = "show " + kind;
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(() => (noteEl.className = ""), 4200);
  }

  async function api(path, init) {
    const res = await fetch(BASE + path, { cache: "no-store", ...init });
    return res.json();
  }

  /**
   * 复制：先试浏览器剪贴板，再试 execCommand，最后交给运行时写系统剪贴板。
   * 卡片嵌在宿主的沙箱 iframe 里，没有 clipboard-write 权限，前两条都可能失败。
   */
  async function copyText(text) {
    const body = String(text || "");
    if (!body) return false;
    try {
      await navigator.clipboard.writeText(body);
      return true;
    } catch {
      /* 继续 */
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = body;
      ta.style.cssText = "position:fixed;top:-9999px;opacity:0";
      document.body.append(ta);
      ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      if (ok) return true;
    } catch {
      /* 继续 */
    }
    try {
      const r = await api("/__copy", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: body }),
      });
      return Boolean(r.ok);
    } catch {
      return false;
    }
  }

  const monthKey = (time) => String(time || "").slice(0, 7);
  function monthLabel(key) {
    if (!key) return "无日期";
    const [y, m] = key.split("-");
    return `${y} 年 ${Number(m)} 月`;
  }

  function matches(m) {
    if (tagFilter && !(m.tags || []).some((t) => t === tagFilter || t.startsWith(tagFilter + "/"))) return false;
    const q = qEl.value.trim().toLowerCase();
    if (!q) return true;
    return (m.content || "").toLowerCase().includes(q) || (m.tags || []).some((t) => t.toLowerCase().includes(q));
  }

  function renderChips() {
    const counts = new Map();
    for (const m of memos) for (const t of m.tags || []) counts.set(t, (counts.get(t) || 0) + 1);
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14);
    chipsEl.textContent = "";
    for (const [name, n] of top) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (tagFilter === name ? " on" : "");
      b.textContent = `${name} ${n}`;
      b.addEventListener("click", () => {
        tagFilter = tagFilter === name ? "" : name;
        renderChips();
        renderList();
      });
      chipsEl.append(b);
    }
    chipsEl.append(countEl);
  }

  function renderList() {
    const shown = memos.filter(matches);
    countEl.textContent = memos.length ? `${shown.length}/${memos.length}` : "";
    listEl.textContent = "";
    if (!memos.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "本地还没有笔记。点右上「导入」，选 flomo 导出的 zip；或者直接拖进来。";
      listEl.append(d);
      return;
    }
    if (!shown.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "没有匹配的笔记。";
      listEl.append(d);
      return;
    }
    let current = "";
    for (const m of shown) {
      const key = monthKey(m.time);
      if (key !== current) {
        current = key;
        const g = document.createElement("div");
        g.className = "group";
        g.textContent = monthLabel(key);
        listEl.append(g);
      }
      listEl.append(memoNode(m));
    }
  }

  function memoNode(m) {
    const box = document.createElement("div");
    box.className = "memo";
    box.dataset.no = String(m.no || "");

    const time = document.createElement("div");
    time.className = "time";
    const no = document.createElement("span");
    no.className = "no";
    no.textContent = m.no ? `#${m.no}` : "#?";
    time.append(no, document.createTextNode(String(m.time || "").slice(5)));

    const text = document.createElement("div");
    text.className = "text";
    text.textContent = m.content || "";
    text.addEventListener("click", () => box.classList.toggle("open"));

    box.append(time, text);

    if (m.tags && m.tags.length) {
      const tags = document.createElement("div");
      tags.className = "tags";
      for (const t of m.tags) {
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = "#" + t;
        tags.append(s);
      }
      box.append(tags);
    }

    const acts = document.createElement("div");
    acts.className = "acts";

    const quote = document.createElement("button");
    quote.type = "button";
    quote.textContent = "引用";
    quote.title = "把这一整条发进当前会话（过长只发编号）";
    quote.addEventListener("click", (e) => {
      e.stopPropagation();
      void quoteIntoSession({ no: m.no, kind: "note" }, quote);
    });

    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "复制";
    copy.title = "只复制到剪贴板，不打扰会话";
    copy.addEventListener("click", async (e) => {
      e.stopPropagation();
      const ok = await copyText(m.content || "");
      say(ok ? "已复制" : "复制失败", ok ? "ok" : "bad");
    });

    acts.append(quote, copy);
    box.append(acts);
    return box;
  }

  async function activeSession() {
    try {
      const s = await hana.sessions.getActive();
      const sessionId = s?.sessionId || s?.id || "";
      const sessionPath = s?.sessionPath || s?.path || "";
      return { sessionId, sessionPath };
    } catch {
      return { sessionId: "", sessionPath: "" };
    }
  }

  async function quoteIntoSession(payload, btn) {
    const target = await activeSession();
    if (!target.sessionId && !target.sessionPath) {
      say("没拿到当前会话，先在主窗口打开一个对话", "bad");
      return;
    }
    if (btn) btn.disabled = true;
    try {
      const r = await api("/__quote", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ...payload, sessionId: target.sessionId, sessionPath: target.sessionPath }),
      });
      if (r.ok) say(payload.kind === "selection" ? "选中段落已投递" : "已投递到当前会话", "ok");
      else say(r.error || "投递失败", "bad");
    } catch (err) {
      say(`投递失败：${err?.message || err}`, "bad");
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // ---- 划词引用 ----
  function hideSelBtn() {
    selBtn.classList.remove("show");
    selBtn.dataset.no = "";
    selBtn.dataset.text = "";
  }

  document.addEventListener("mouseup", () => {
    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel ? String(sel).trim() : "";
      if (!text) {
        hideSelBtn();
        return;
      }
      const node = sel.anchorNode;
      const host = node ? (node.nodeType === 1 ? node : node.parentElement)?.closest?.(".memo") : null;
      if (!host) {
        hideSelBtn();
        return;
      }
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      selBtn.dataset.no = host.dataset.no || "";
      selBtn.dataset.text = text;
      selBtn.style.left = `${Math.min(window.innerWidth - 190, Math.max(6, rect.left))}px`;
      selBtn.style.top = `${Math.max(6, rect.top - 38)}px`;
      selBtn.classList.add("show");
    }, 0);
  });

  selBtn.addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const no = Number(selBtn.dataset.no) || 0;
    const text = selBtn.dataset.text || "";
    if (btn.id === "selCopy") {
      const ok = await copyText(text);
      say(ok ? "已复制选中段落" : "复制失败", ok ? "ok" : "bad");
      hideSelBtn();
      window.getSelection()?.removeAllRanges();
      return;
    }
    hideSelBtn();
    window.getSelection()?.removeAllRanges();
    await quoteIntoSession({ no, kind: "selection", text }, null);
  });

  listEl.addEventListener("scroll", hideSelBtn, { passive: true });

  async function load() {
    try {
      const r = await api("/__memos");
      memos = Array.isArray(r.memos) ? r.memos : [];
      renderChips();
      renderList();
    } catch {
      memos = [];
      countEl.textContent = "";
      listEl.textContent = "";
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "连不上本地服务（127.0.0.1:47811）。重开一次这个卡片试试。";
      listEl.append(d);
    }
  }

  // ---- 写一条 ----
  async function send() {
    const text = draftEl.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    try {
      const r = await api("/__memo/new", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (r.ok) {
        draftEl.value = "";
        autosize();
        say("已发送到 flomo", "ok");
      } else say(r.error || "发送失败", "bad");
    } catch (err) {
      say(`发送失败：${err?.message || err}`, "bad");
    } finally {
      sendBtn.disabled = false;
    }
  }

  function autosize() {
    draftEl.style.height = "auto";
    draftEl.style.height = Math.min(108, draftEl.scrollHeight) + "px";
  }

  sendBtn.addEventListener("click", send);
  draftEl.addEventListener("input", autosize);
  draftEl.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") send();
  });

  // ---- 导入 ----
  async function upload(file) {
    if (!file) return;
    say(`正在导入 ${file.name}…`);
    try {
      const buf = await file.arrayBuffer();
      const res = await fetch(`${BASE}/__sync/upload?name=${encodeURIComponent(file.name)}`, {
        method: "POST",
        headers: { "content-type": "application/octet-stream" },
        body: buf,
      });
      const r = await res.json();
      if (r.ok) {
        say(`已导入 ${r.parsed} 条，新增 ${r.added} 条，共 ${r.total} 条`, "ok");
        await load();
      } else say(r.reason || r.error || "这个文件里没有 flomo 笔记", "bad");
    } catch (err) {
      say(`导入失败：${err?.message || err}`, "bad");
    }
  }

  el("pick").addEventListener("click", () => el("file").click());
  el("file").addEventListener("change", () => {
    const f = el("file").files && el("file").files[0];
    el("file").value = "";
    if (f) void upload(f);
  });
  el("refresh").addEventListener("click", () => load());
  el("web").addEventListener("click", async () => {
    try {
      await api("/__open", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ url: "https://v.flomoapp.com/mine" }),
      });
    } catch {
      say("打不开浏览器", "bad");
    }
  });

  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    e.preventDefault();
    dragDepth += 1;
    el("drop").classList.add("show");
  });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("dragleave", () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) el("drop").classList.remove("show");
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    dragDepth = 0;
    el("drop").classList.remove("show");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) void upload(f);
  });

  qEl.addEventListener("input", renderList);
  try {
    hana.theme?.subscribe?.(() => applyTheme());
  } catch {
    /* 旧宿主 */
  }
  try {
    hana.chrome?.registerScrollSource?.(listEl);
  } catch {
    /* 旧宿主不认识就算了 */
  }
  await hana.ready?.();
  await load();
</script>
</body>
</html>
